! Synthetic Eltex example; not a production export
hostname example-eltex-switch

vlan 10
 name management
vlan 20
 name users
vlan 30
 name voice
vlan 999
 name quarantine

interface gigabitethernet 1/0/1
 description synthetic-access
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 storm-control broadcast level 2
 storm-control multicast level 2
 port-isolation
 power inline auto
 no shutdown
exit

interface gigabitethernet 1/0/24
 description synthetic-trunk
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,999
 switchport trunk native vlan 10
 spanning-tree guard root
 no shutdown
exit

spanning-tree mode mstp
spanning-tree mst configuration
 name synthetic-region
 revision 1
 instance 0 vlan 10,20,30,999
exit

ip access-list extended synthetic-acl
 deny ip 192.0.2.0 0.0.0.255 any
 permit ip any any
exit
interface vlan 20
 ip access-group synthetic-acl in
exit
