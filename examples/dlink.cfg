; Synthetic D-Link example; not a production export
config sysname example-dlink-switch

create vlan management tag 10
create vlan users tag 20
create vlan voice tag 30
create vlan quarantine tag 999

config vlan management add tagged 1:24
config vlan users add untagged 1:1-1:8
config vlan users add tagged 1:24
config vlan voice add tagged 1:24
config vlan quarantine add tagged 1:24
config ports 1:1-1:8 pvid 20
config ports 1:24 pvid 10

config ports 1:1 state enable
config ports 1:1 flow_control disable
config ports 1:1 storm_control broadcast enable threshold 2
config ports 1:1 port_security enable
config ports 1:1 port_isolation enable
config ports 1:1 poe enable

config ports 1:24 state enable
config ports 1:24 dot1q vlan_trunk enable
config stp mode mstp
config stp mst_config name synthetic-region revision 1
config stp mst_config instance 0 add vlan 10,20,30,999

create access_profile profile_id 10 profile_name synthetic-acl
config access_profile profile_id 10 add access_id 1 ip source_ip 192.0.2.0/24 action deny
config access_profile profile_id 10 access vlan 20
enable traffic_segmentation
