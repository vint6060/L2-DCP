! Synthetic FiberHome example; not a production export
sysname example-fiberhome-switch

vlan batch 10 20 30 999
vlan 10
 name management
quit
vlan 20
 name users
quit
vlan 30
 name voice
quit

interface ethernet 0/0/1
 description synthetic-access
 port link-type access
 port default vlan 20
 stp edged-port enable
 broadcast-suppression 2
 multicast-suppression 2
 port-isolate enable
 poe enable
quit

interface ethernet 0/0/24
 description synthetic-trunk
 port link-type trunk
 port trunk allow-pass vlan 10 20 30 999
 port trunk pvid vlan 10
 stp root-protection enable
quit

stp mode mstp
stp region-configuration
 region-name synthetic-region
 revision-level 1
 instance 0 vlan 10 20 30 999
 active region-configuration
quit

acl number 3000
 rule 5 deny ip source 192.0.2.0 0.0.0.255
 rule 10 permit ip
quit
traffic-filter vlan 20 inbound acl 3000
