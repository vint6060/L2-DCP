! Synthetic SNR example; not a production export
version 1.0
hostname example-snr-switch

vlan 10 name management
vlan 20 name users
vlan 30 name voice
vlan 999 name quarantine

interface ethernet 1/0/1
 description synthetic-user-port
 no shutdown
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 storm-control broadcast 2
 storm-control multicast 2
 port-isolation enable
 poe enable
exit

interface ethernet 1/0/24
 description synthetic-uplink
 no shutdown
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,999
 switchport trunk native vlan 10
 spanning-tree guard root
 storm-control broadcast 5
exit

spanning-tree mode mstp
spanning-tree mst configuration
 name synthetic-region
 revision 1
 instance 0 vlan 10,20,30,999
exit
access-list 10 permit vlan 20
access-list 10 deny any
!
